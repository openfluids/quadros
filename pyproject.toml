[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quadros"
version = "0.1.2"
description = "Snapshot, frame, and video renderer for PyVista-based dense-flow visualization with Nek5000 support"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ricardo A S Frantz" }]
keywords = ["pyvista", "visualization", "cfd", "slurm", "video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy",
  "pillow",
  "pyvista",
  "vtk",
]

[project.optional-dependencies]
nek5000 = ["pymech"]

[project.urls]
Homepage = "https://github.com/openfluids/quadros"
Repository = "https://github.com/openfluids/quadros"
Issues = "https://github.com/openfluids/quadros/issues"

[project.scripts]
quadros = "quadros.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "build>=1.2",
  "twine>=5",
  "ruff>=0.8",
]

# An allow-list, not an exclude-list. hatchling's default is to ship everything
# git does not ignore, which put six ParaView state files (~5.5 MB) into the
# 0.1.1 sdist. The repo root collects stray files over time, so an exclude-list
# would silently ship each new one; naming what belongs cannot drift that way.
[tool.hatch.build.targets.sdist]
include = [
  "src/quadros",
  "tests",
  "docs",
  "configs",
  "slurm",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py311"

# The two _legacy_* modules are vendored scripts kept for reference, not
# maintained source. Linting them produces noise nobody will act on.
extend-exclude = ["src/quadros/_legacy_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
