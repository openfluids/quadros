[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neksnap"
version = "0.1.0"
description = "Reusable Nek5000 snapshot, frame, and video renderer for PyVista-based dense-flow visualization"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ricardo A S Frantz" }]
keywords = ["nek5000", "pyvista", "visualization", "cfd", "slurm", "video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy",
  "pillow",
  "pyvista",
  "pymech",
  "vtk",
]

[project.urls]
Homepage = "https://github.com/ricardofrantz/neksnap"
Repository = "https://github.com/ricardofrantz/neksnap"
Issues = "https://github.com/ricardofrantz/neksnap/issues"

[project.scripts]
neksnap = "neksnap.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "build>=1.2",
  "twine>=5",
]
